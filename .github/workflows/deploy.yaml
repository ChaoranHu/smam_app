# Deploys the app to shinyapps.io whenever main changes, or on demand from
# the Actions tab (Run workflow). Needs two repository secrets:
# SHINYAPPS_TOKEN and SHINYAPPS_SECRET (shinyapps.io > Account > Tokens).
name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GSL (needed to build smam)
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("rsconnect", "shiny", "bslib", "DT", "ggplot2", "callr", "smam"))
        shell: Rscript {0}

      - name: Deploy
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_COMMAND: ${{ secrets.SHINYAPPS_COMMAND }}
        run: |
          # Either paste the whole rsconnect::setAccountInfo(...) command that
          # shinyapps.io copies (secret SHINYAPPS_COMMAND), or the token and
          # secret separately. Stray spaces and line breaks are removed.
          field <- function(cmd, key) {
            m <- regmatches(cmd, regexec(paste0(key, "\\s*=\\s*['\"]([^'\"]+)['\"]"), cmd))[[1]]
            if (length(m) == 2) m[2] else ""
          }
          cmd <- Sys.getenv("SHINYAPPS_COMMAND")
          token <- if (nzchar(cmd)) field(cmd, "token") else Sys.getenv("SHINYAPPS_TOKEN")
          secret <- if (nzchar(cmd)) field(cmd, "secret") else Sys.getenv("SHINYAPPS_SECRET")
          token <- gsub("[[:space:]]", "", token)
          secret <- gsub("[[:space:]]", "", secret)
          cat("token length:", nchar(token), " secret length:", nchar(secret), "\n")
          if (!nzchar(token) || !nzchar(secret)) stop("Token or secret is empty. Check the repository secrets.")
          rsconnect::setAccountInfo(name = "huchaoran", token = token, secret = secret)
          rsconnect::deployApp(
            appName = "smam_app",
            appFiles = c("app.R", list.files("R", full.names = TRUE)),
            account = "huchaoran",
            server = "shinyapps.io",
            forceUpdate = TRUE
          )
        shell: Rscript {0}
